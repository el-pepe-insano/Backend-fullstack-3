apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pedidos-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pedidos-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-pedidos
  template:
    metadata:
      labels:
        app: postgres-pedidos
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: Bullseye
            - name: POSTGRES_DB
              value: godofgames_pedidos
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pedidos-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-pedidos-service
spec:
  selector:
    app: postgres-pedidos
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432