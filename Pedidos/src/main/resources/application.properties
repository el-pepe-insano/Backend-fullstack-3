spring.application.name=Pedidos
server.port=8083

spring.datasource.url=jdbc:postgresql://postgres-service:5432/godofgames_pedidos
spring.datasource.username=postgres
spring.datasource.password=Bullseye

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=requiemElMejorJuegoDeGodOfGames2026SecretKeyParaJWT12345678901234

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.packages-to-scan=com.GodOfGames.Pedidos

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
inventario.service.url=http://inventario-service:8082

# Amazon SQS (Spring Cloud AWS)
# En EC2/Kubernetes las credenciales salen del IAM Role o de AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# (cadena de credenciales por defecto del SDK). Para LocalStack se definen por variable de entorno:
#   SPRING_CLOUD_AWS_SQS_ENDPOINT=http://localhost:4566
#   SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=test
#   SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=test
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
