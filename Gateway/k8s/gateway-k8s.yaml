apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway-app
        image: ryuko67/godofgames-gateway:v4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: JWT_SECRET
          value: "requiemElMejorJuegoDeGodOfGames2026SecretKeyParaJWT12345678901234"
        - name: AZURE_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: entra-id-config
              key: tenant-id
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: entra-id-config
              key: client-id
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer