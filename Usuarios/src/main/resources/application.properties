spring.application.name=Usuarios-Z
server.port=8081

# ¡OJO AQUÍ! Cambiamos localhost por el nombre del servicio de Kubernetes
spring.datasource.url=jdbc:postgresql://postgres-service:5432/godofgames_usuarios
spring.datasource.username=postgres
spring.datasource.password=postgres 

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html

# Amazon SQS (Spring Cloud AWS)
# En EC2/Kubernetes las credenciales salen del IAM Role o de AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# (cadena de credenciales por defecto del SDK). Para LocalStack se definen por variable de entorno:
#   SPRING_CLOUD_AWS_SQS_ENDPOINT=http://localhost:4566
#   SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=test
#   SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=test
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
