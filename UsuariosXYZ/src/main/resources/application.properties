spring.application.name=Usuarios-Z
server.port=8081

# ¡OJO AQUÍ! Cambiamos localhost por el nombre del servicio de Kubernetes
spring.datasource.url=jdbc:postgresql://postgres-service:5432/godofgames_usuarios
