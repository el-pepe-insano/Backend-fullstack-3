apiVersion: v1
kind: Service
metadata:
  name: usuarios-service
spec:
  selector:
    app: java-usuarios-app
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: LoadBalancer 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-usuarios-app
  template:
    metadata:
      labels:
        app: java-usuarios-app
    spec:
      containers:
        - name: backend-usuarios
          image: ryuko67/godofgames-usuarios:v2  # Actualizado a v2
          imagePullPolicy: Always        # Obliga a buscar la imagen nueva
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/godofgames_usuarios"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "admin123"