spring.application.name=Notificaciones
server.port=8088

# Base de datos
spring.datasource.url=jdbc:postgresql://postgres-service:5432/godofgames_notificaciones
spring.datasource.username=postgres
spring.datasource.password=Bullseye

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Amazon SQS (Spring Cloud AWS)
# En EC2/Kubernetes las credenciales salen del IAM Role o de AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# (cadena de credenciales por defecto del SDK). Para LocalStack se definen por variable de entorno:
#   SPRING_CLOUD_AWS_SQS_ENDPOINT=http://localhost:4566
#   SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=test
#   SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=test
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always