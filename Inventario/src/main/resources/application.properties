spring.application.name=Inventario
server.port=8082

# Base de datos
spring.datasource.url=jdbc:postgresql://postgres-service:5432/godofgames_inventario
spring.datasource.username=postgres
spring.datasource.password=Bullseye

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# CORRECCIÓN: El dialecto no necesita especificarse en versiones modernas de Hibernate
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Evita warning de open-in-view
spring.jpa.open-in-view=false

# JWT
jwt.secret=requiemElMejorJuegoDeGodOfGames2026SecretKeyParaJWT12345678901234

# Actuator - necesario para los health probes de Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.packages-to-scan=com.GodOfGames.Inventario
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

#imagenes de productos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB